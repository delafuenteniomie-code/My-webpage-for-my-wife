<!DOCTYPE html>
<html>
<head>
  <title>SCNHS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8fafc;
      color: #334155;
    }

    /* Topbar - Clean White Header with Accent Line */
    .topbar {
      background: #ffffff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #2563eb;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .topbar h2 {
      color: #1e293b;
      margin: 0;
    }

    .topbar a {
      color: #475569;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    /* Content Card - Soft Blue Accent */
    .content {
      background: #ffffff;
      max-width: 600px;
      margin: 50px auto;
      padding: 35px;
      border-radius: 12px;
      border-left: 6px solid #2563eb;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .content h1 {
      color: #1e293b;
      margin-top: 0;
    }

    /* Footer - Modern Slate Dark */
    .footer {
      background: #0f172a;
      color: #cbd5e1;
      padding: 30px 20px 15px;
    }

    .footer-grid {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .footer h3 {
      color: #60a5fa;
      margin-top: 0;
    }

    .copyright {
      text-align: center;
      margin-top: 25px;
      border-top: 1px solid #334155;
      padding-top: 15px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <h2>SCNHS</h2>
    <div>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <h1>Welcome to SCNHS</h1>
    <p>Providing quality education and excellence for all students.</p>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-grid">
      <div>
        <h3>SCNHS</h3>
        <p>Building a bright future.</p>
      </div>
      <div>
        <h3>Web Creators</h3>
        <p>Juan Dela Cruz</p>
        <p>Maria Santos</p>
      </div>
      <div>
        <h3>Contact</h3>
        <p>info@scnhs.edu</p>
        <p>+63 912 345 6789</p>
      </div>
    </div>
    <div class="copyright">
      &copy; 2026 SCNHS. All rights reserved.
    </div>
  </div>

</body>
</html>
