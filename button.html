<!DOCTYPE html>
<html>
<head>
<style>
  body {
    text-align: center;
    padding: 50px;
    background: #f0f0f0;
  }

  .btn {
    padding: 12px 25px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn-green {
    background: #4CAF50;
    color: white;
  }
  .btn-green:hover {
    background: #45a049;
  }

  .btn-red {
    background: #f44336;
    color: white;
  }
  .btn-red:hover {
    background: #d32f2f;
  }

  .btn-blue {
    background: #2196F3;
    color: white;
  }
  .btn-blue:hover {
    background: #1976D2;
  }
</style>
</head>
<body>

  <button class="btn btn-green">Save</button>
  <button class="btn btn-red">Delete</button>
  <button class="btn btn-blue">Submit</button>

</body>
</html>
