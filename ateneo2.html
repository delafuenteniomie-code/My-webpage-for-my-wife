<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ateneo de Manila University</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      color: white;
    }

    /* 1. BLUE HEADER */
    .header {
      background-color: #002C76; /* Ateneo blue */
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-icon {
      width: 30px;
      cursor: pointer;
    }
    .menu-icon div {
      width: 100%;
      height: 3px;
      background-color: white;
      margin: 6px 0;
    }

    .header-center {
      text-align: center;
      flex: 1;
    }
    .header-center img {
      width: 70px;
      height: 70px;
    }
    .header-center h1 {
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 1px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .search-icon {
      font-size: 22px;
      cursor: pointer;
    }

    /* 2. HERO SECTION WITH IMAGE + TEXT OVERLAY */
    .hero {
      height: 90vh; /* full screen height */
      background-image: 
        linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.5)),
        url('campus.jpg'); /* put your campus photo here */
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h2 {
      font-size: 16px;
      font-weight: normal;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .hero h3 {
      font-size: 42px;
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 16px;
      font-family: Verdana, sans-serif;
      line-height: 1.6;
      max-width: 320px;
    }

    /* Mobile tweak */
    @media (max-width: 600px) {
      .header-center h1 { font-size: 14px; }
      .hero h3 { font-size: 32px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="menu-icon">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="header-center">
      <img src="/img.html/car1.png" alt="Ateneo Seal">
      <h1>Ateneo de Manila<br>University</h1>
    

    <div class="search-icon">🔍</div>
  </header>

  <!-- HERO --><div></div>
  <section class="hero">
    <h2>A UNIVERSITY FOR THE 21ST</h2>
    <h2>CENTURY</h2>
    <h3>Lux in<br>Domino</h3>
    <p>
      Ateneo de Manila University will be a 
      force for good in seeking innovative 
      solutions to...
    </p>
  </section>

</body>
</html>>
