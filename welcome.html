<!DOCTYPE html>
<html>
<head>
<style>
  body { background:#0B1116; color:white; font-family:verdana; text-align:center; padding:20px; }
  .welcome-bg {
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('school.jpg');
    background-size: cover;
    background-position: center;
    height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-radius: 10px;
    margin-bottom: 30px;
  }
  .welcome-table {
    background-color: #1E3A8A;
    color: white;
    width: 80%;
    margin: 30px auto;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
  }
  .welcome-table td, .welcome-table th { padding: 15px; border: 1px solid #0F172A; }
</style>
</head>
<body>
  <div class="welcome-bg">
    <h1><big><big>WELCOME TO</big></big></h1>
    <h1><big><big>SANTIAGO CITY NATIONAL HIGH SCHOOL</big></big></h1>
  </div>
  
  <table class="welcome-table">
    <tr><th>Subject</th><th>Teacher</th></tr>
    <tr><td>Math</td><td>Sir Reyes</td></tr>
    <tr><td>English</td><td>Ma'am Santos</td></tr>
    <tr><td>Science</td><td>Ma'am Cruz</td></tr>
  </table>
</body>
</html>
